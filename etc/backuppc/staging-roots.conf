# =============================================================================
# /etc/backuppc/staging-roots.conf
# =============================================================================
#
# Allowlist of staging root directories for backuppc-staging-cleanup.
# One directory per line. Comments start with #. Blank lines ignored.
#
# Security:
#   - This file MUST be owned by root:root (mode 644 or stricter)
#   - backuppc-staging-cleanup validates ownership before reading
#   - Paths must be absolute and will be canonicalized via realpath
#
# Usage:
#   The cleanup helper accepts paths that are UNDER these roots.
#   Example: If /srv/backuppc-staging is listed, then
#            /srv/backuppc-staging/nextcloud can be cleaned,
#            but /srv/backuppc-staging itself cannot.
#
# =============================================================================

# Default BackupPC staging area
/srv/backuppc-staging

# Add service-specific staging roots as needed:
# /var/lib/mysql-staging
# /export/mariadb/backuppc
