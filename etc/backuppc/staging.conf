# =============================================================================
# /etc/backuppc/staging.conf
# =============================================================================
#
# Unified configuration for BackupPC staging helpers:
#   - backuppc-staging-cleanup  (privileged cleanup of staging directories)
#   - backuppc-staging-extract  (extract files from containers to staging)
#
# Allowlist of staging root directories. One directory per line.
# Comments start with #. Blank lines ignored.
#
# Security:
#   - This file MUST be owned by root:root (mode 644 or stricter)
#   - Both helpers validate ownership before reading
#   - Paths must be absolute and will be canonicalized via realpath
#
# Usage:
#   Both helpers accept paths that are UNDER these roots.
#   Example: If /srv/backuppc-staging is listed, then
#            /srv/backuppc-staging/nextcloud can be cleaned/written,
#            but /srv/backuppc-staging itself cannot.
#
# =============================================================================

# Default BackupPC staging area
/srv/backuppc-staging

# Add service-specific staging roots as needed:
# /var/lib/mysql-staging
# /export/mariadb/backuppc
